# Publishes the npm packages and the attested merlion.wasm for a signed v* tag
# (specs/supply-chain.md#releases). Tag pushes are the only trigger; only the publish job,
# gated by the protected `release` environment, holds id-token: write. No caches.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag signed by a maintainer and reachable from main
        # The signers file comes from main, so a tagged commit can't vouch for itself.
        run: |
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$TAG"
          git merge-base --is-ancestor "$TAG^{commit}" origin/main
      - name: Tag matches every package version
        run: node scripts/release-check.mjs "$TAG"

  build:
    # Two runner images on two OS families; publish fails unless both .wasm files match.
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Build merlion.wasm
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          sh packages/merlion-wasm/scripts/build-wasm.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-${{ matrix.os }}
          path: packages/merlion-wasm/merlion.wasm
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance and trusted publishing, the build attestation
      attestations: write
    env:
      MERLION_RELEASE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wasm-*
          path: ${{ runner.temp }}/wasm
      - name: Both builds byte-identical; record the SHA-256
        run: |
          cmp "$RUNNER_TEMP/wasm/wasm-ubuntu-24.04/merlion.wasm" "$RUNNER_TEMP/wasm/wasm-macos-15/merlion.wasm"
          cp "$RUNNER_TEMP/wasm/wasm-ubuntu-24.04/merlion.wasm" packages/merlion-wasm/merlion.wasm
          node packages/merlion-wasm/scripts/record-sha256.mjs packages/merlion-wasm
          (cd packages/merlion-wasm && sha256sum merlion.wasm) > "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/merlion-wasm/merlion.wasm
      - run: corepack enable
      - name: Install workspace (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package tests over the release merlion.wasm
        run: pnpm --filter "./packages/*" test
      - name: Pack
        # pnpm pack rewrites workspace: ranges to the released version.
        run: |
          for dir in $(node scripts/release-check.mjs "$TAG"); do
            pnpm --dir "$dir" pack --pack-destination "$RUNNER_TEMP/dist"
          done
      - name: Publish to npm with provenance
        # Trusted publishing (OIDC) needs npm >= 11.5.1. A package's first release, before
        # its trusted publisher can be configured, reads NPM_TOKEN from the release
        # environment instead; the secret is deleted once every package has one.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) predates trusted publishing (11.5.1)"; exit 1; }
          version=${TAG#v}
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          for dir in $(node scripts/release-check.mjs "$TAG"); do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
              continue
            fi
            tarball="$RUNNER_TEMP/dist/$(echo "$name" | tr -d @ | tr / -)-$version.tgz"
            npm publish "$tarball" --provenance --access public --tag "$dist_tag"
          done
      - name: GitHub release with merlion.wasm and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease=1 ;; esac
          gh release create "$TAG" --verify-tag --generate-notes ${prerelease:+--prerelease} \
            packages/merlion-wasm/merlion.wasm "$RUNNER_TEMP/SHA256SUMS"
