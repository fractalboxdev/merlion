# Deploys the docs site (docs/) to Cloudflare Workers static assets on every push to main.
# Never runs on pull_request: the job holds the Cloudflare secrets.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   API token scoped to Account → Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the merlion-docs Worker
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: rustup toolchain install
      - run: corepack enable
      - name: Build merlion.wasm
        run: sh packages/merlion-wasm/scripts/build-wasm.sh
      - name: Install workspace (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and deploy
        run: pnpm --filter docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
