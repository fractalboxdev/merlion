[workspace]
resolver = "2"
members = ["crates/merlion-render", "crates/merlion-cli", "crates/merlion-wasm", "tools/fontgen"]
default-members = ["crates/merlion-render", "crates/merlion-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fractalboxdev/merlion"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "s"
